name: cop-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cop}
      POSTGRES_USER: ${POSTGRES_USER:-cop}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-cop} -d ${POSTGRES_DB:-cop}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:5432:5432'
    restart: unless-stopped
    volumes:
      - cop_postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - cop_mailpit_data:/data

volumes:
  cop_postgres_data:
  cop_mailpit_data:
