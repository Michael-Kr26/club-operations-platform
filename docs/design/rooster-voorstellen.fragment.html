<script>
  (() => {
    const root = document.getElementById('cop-roster-concepts');
    const names = ['Noor', 'Sam', 'Lisa', 'Daan'];
    const shiftTypes = ['Allround', 'Gastheer', 'Clubmanager'];
    const initial = {
      week: {
        view: 'manager',
        tab: 'roster',
        day: 0,
        person: 'Noor',
        available: [true, true, false, true, true, false, false],
        added: [],
        claimed: false,
      },
      cards: {
        view: 'manager',
        tab: 'roster',
        day: 0,
        person: 'Noor',
        available: [true, true, false, true, true, false, false],
        added: [],
        claimed: false,
      },
      coverage: {
        view: 'manager',
        tab: 'roster',
        day: 0,
        person: 'Noor',
        available: [true, true, false, true, true, false, false],
        added: [],
        claimed: false,
      },
    };
    let states = structuredClone(initial);
    const days = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
    const dates = ['26', '27', '28', '29', '30', '31', '1'];
    const own = [
      {
        day: 0,
        time: '09:00–15:00',
        role: 'Receptie',
        site: 'Barneveld',
        shiftType: 'Gastheer',
      },
      {
        day: 2,
        time: '15:00–21:00',
        role: 'Fitness',
        site: 'Barneveld',
        shiftType: 'Allround',
      },
      {
        day: 4,
        time: '09:00–15:00',
        role: 'Clubbeheer',
        site: 'Ede',
        shiftType: 'Clubmanager',
      },
    ];
    function restore(value) {
      if (!value || !value.privateContent || !value.privateContent.concepts)
        return;
      for (const key of Object.keys(initial)) {
        const saved = value.privateContent.concepts[key];
        if (
          saved &&
          ['manager', 'employee'].includes(saved.view) &&
          ['roster', 'availability', 'open'].includes(saved.tab)
        ) {
          states[key] = {
            ...structuredClone(initial[key]),
            ...saved,
            added: Array.isArray(saved.added) ? saved.added.slice(0, 12) : [],
          };
        }
      }
    }
    restore(window.openai?.widgetState);
    function save() {
      window.openai
        ?.setWidgetState({
          modelContent: {
            ontwerpen: ['Weekoverzicht', 'Dienstkaarten', 'Bezetting'],
            mobiel: 'Eigen rooster, beschikbaarheid en open diensten',
            diensttypen: shiftTypes,
            actieveWeergaven: Object.fromEntries(
              Object.entries(states).map(([k, s]) => [k, s.view]),
            ),
          },
          privateContent: { concepts: states },
        })
        ?.catch(() => {});
    }
    function esc(value) {
      return String(value).replace(
        /[&<>"']/g,
        (c) =>
          ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          })[c],
      );
    }
    function icon(name) {
      return `<i data-lucide="${name}" aria-hidden="true"></i>`;
    }
    function pool(s) {
      return `<div class="cop-pool"><div class="cop-pool-title"><h3>Beschikbare medewerkers</h3><small>Barneveld</small></div><div class="cop-people">${names.map((n, i) => `<button class="cop-person" data-person="${n}" draggable="true" aria-pressed="${s.person === n}"><span class="cop-avatar">${n[0]}</span><span><strong>${n}</strong><small>${[18, 12, 16, 8][i]} / ${[24, 24, 20, 16][i]} uur</small></span></button>`).join('')}</div><p class="cop-note">Selecteer of sleep naar een dienst.</p></div>`;
    }
    function dayPicker(s) {
      return `<div class="cop-days" aria-label="Dag kiezen">${days.map((d, i) => `<button data-day="${i}" aria-pressed="${s.day === i}">${d}<strong>${dates[i]}</strong></button>`).join('')}</div>`;
    }
    function header(layout) {
      return `<div class="cop-top"><div><h2>${layout === 'coverage' ? 'Bezetting per diensttype' : 'Rooster'}</h2><p class="cop-sub">Barneveld · 26 oktober – 1 november 2026</p></div><button class="cop-button cop-primary" data-publish>Publiceren</button></div><div class="cop-controls"><span class="cop-button">Barneveld</span><span class="cop-tag">Concept</span><small>Voorbeeld · wijzigingen blijven in dit ontwerp</small></div>`;
    }
    function cell(time, role, shiftType = 'Allround') {
      return `<button class="cop-shift" data-details="${time}|${esc(role)}|Barneveld|${esc(shiftType)}"><strong>${time}</strong><span class="cop-shift-type">${esc(shiftType)}</span><span>${esc(role)}</span></button>`;
    }
    function week(s) {
      let html = `${pool(s)}<div class="cop-week" aria-label="Weekrooster"><div class="cop-cell cop-day">Medewerker</div>${days.map((d, i) => `<div class="cop-cell cop-day">${d}<strong>${dates[i]}</strong></div>`).join('')}`;
      const shifts = [
        [0, 2, 4],
        [1, 3, 5],
        [0, 1, 4],
        [2, 5, 6],
      ];
      names.forEach((name, r) => {
        html += `<div class="cop-cell cop-name">${name}<small>${[18, 12, 16, 8][r]} / ${[24, 24, 20, 16][r]} uur</small></div>`;
        days.forEach((_, d) => {
          const added = s.added.find((x) => x.person === name && x.day === d);
          html += `<div class="cop-cell" data-drop="${d}" data-target="${name}">${added ? cell(esc(added.time), added.role || 'Receptie', added.shiftType || 'Allround') : shifts[r].includes(d) ? cell(r % 2 ? '15:00–21:00' : '09:00–15:00', r === 3 ? 'Clubbeheer' : r % 2 ? 'Fitness' : 'Receptie', r === 3 ? 'Clubmanager' : r % 2 ? 'Allround' : 'Gastheer') : `<button class="cop-add" data-plan="${d}" data-target="${name}" aria-label="Dienst voor ${name} op ${days[d]} ${dates[d]} plannen">+</button>`}</div>`;
        });
      });
      return (
        html +
        '</div><p class="cop-note">Blauw: ingepland · lege vakken: planbaar · kies een dienst voor details.</p>'
      );
    }
    function board(s) {
      return `${pool(s)}<div class="cop-board">${[0, 1, 2]
        .map((off) => {
          const d = (s.day + off) % 7;
          return `<div class="cop-lane" data-drop="${d}"><h3>${days[d]} ${dates[d]} oktober</h3><div class="cop-shift-card"><strong>09:00–15:00</strong><span class="cop-shift-type">Gastheer</span><p class="cop-sub">Receptie</p><div class="cop-shift-person"><span class="cop-avatar">N</span>Noor</div><button class="cop-button" data-details="09:00–15:00|Receptie|Barneveld|Gastheer">Dienst bekijken</button></div>${s.added
            .filter((x) => x.day === d)
            .map(
              (x) =>
                `<div class="cop-shift-card"><strong>${esc(x.time)}</strong><span class="cop-shift-type">${esc(x.shiftType || 'Allround')}</span><p class="cop-sub">${esc(x.role || 'Fitness')} · ${esc(x.person)}</p><button class="cop-button" data-details="${esc(x.time)}|${esc(x.role || 'Fitness')}|Barneveld|${esc(x.shiftType || 'Allround')}">Dienst bekijken</button></div>`,
            )
            .join(
              '',
            )}<div class="cop-shift-card cop-open"><strong>15:00–21:00</strong><span class="cop-shift-type">Allround</span><p>Fitness · nog invullen</p><button class="cop-button" data-plan="${d}" data-role="Fitness" data-shift-type="Allround">${esc(s.person)} inplannen</button></div></div>`;
        })
        .join('')}</div>`;
    }
    function coverage(s) {
      return `${dayPicker(s)}<div class="cop-coverage-layout"><div>${shiftTypes
        .map((shiftType, i) => {
          const role = ['Fitness', 'Receptie', 'Clubbeheer'][i];
          const assigned = s.added.find(
            (x) => x.day === s.day && (x.shiftType || 'Allround') === shiftType,
          );
          const time = ['09:00–15:00', '09:00–15:00', '18:00–20:00'][i];
          return `<div class="cop-requirement" data-drop="${s.day}" data-role="${role}" data-shift-type="${shiftType}"><div class="cop-requirement-head"><h3>${shiftType}</h3><span class="cop-tag ${i === 0 && !assigned ? 'cop-open' : ''}">${i === 0 && !assigned ? '1 van 2 ingevuld' : 'Volledig bezet'}</span></div><p class="cop-sub">Activiteit · ${role}</p><div class="cop-slot"><span><strong>${time}</strong><br>${['Lisa', 'Noor', 'Daan'][i]}</span><button class="cop-button" data-details="${time}|${role}|Barneveld|${shiftType}">Details</button></div>${i === 0 ? `<div class="cop-slot"><span><strong>${assigned ? esc(assigned.time) : '15:00–21:00'}</strong><br>${assigned ? esc(assigned.person) : 'Open dienst'}</span>${assigned ? `<button class="cop-button" data-details="${esc(assigned.time)}|${role}|Barneveld|${shiftType}">Details</button>` : `<button class="cop-button cop-primary" data-plan="${s.day}" data-role="${role}" data-shift-type="${shiftType}">${esc(s.person)} inplannen</button>`}</div>` : ''}</div>`;
        })
        .join('')}</div>${pool(s)}</div>`;
    }
    function agendaItem(x) {
      return `<div class="cop-agenda"><div class="cop-date">${days[x.day]}<strong>${dates[x.day]}</strong></div><div class="cop-agenda-main"><button data-details="${x.time}|${x.role}|${x.site}|${x.shiftType}"><strong>${x.time}</strong><span class="cop-shift-type">${x.shiftType}</span><small>${x.role} · ${x.site}</small></button><span class="cop-tag">Gepubliceerd</span></div></div>`;
    }
    function employee(layout, s) {
      let content = '';
      if (s.tab === 'availability') {
        content = `<h3>Mijn beschikbaarheid</h3><p class="cop-sub">Week van 26 oktober · hele dagen</p>${days.map((d, i) => `<div class="cop-availability"><label><input type="checkbox" data-available="${i}" ${s.available[i] ? 'checked' : ''}>${d} ${dates[i]} ${i === 6 ? 'nov' : 'okt'}</label><small>${s.available[i] ? 'Beschikbaar' : 'Niet beschikbaar'}</small></div>`).join('')}<button class="cop-button cop-primary cop-full" data-save-availability>Beschikbaarheid doorgeven</button>`;
      } else if (s.tab === 'open') {
        content = `<h3>Open diensten</h3><p class="cop-sub">Op jouw gekoppelde locaties</p><div class="cop-shift-card cop-open" style="margin-top:18px"><strong>Za 31 okt · 15:00–21:00</strong><span class="cop-shift-type">Allround</span><p class="cop-sub">Fitness · Barneveld</p><button class="cop-button cop-primary" data-claim ${s.claimed ? 'disabled' : ''}>${s.claimed ? 'Aanvraag in behandeling' : 'Interesse doorgeven'}</button></div><p class="cop-note">De planner bevestigt wie de dienst krijgt.</p>`;
      } else if (layout === 'cards') {
        content = `<div class="cop-hero"><p>Je volgende dienst</p><strong>09:00–15:00</strong><span class="cop-shift-type">Gastheer</span><p>Vandaag · Receptie</p><p class="cop-sub">Barneveld · gepubliceerd</p><button class="cop-button" data-details="09:00–15:00|Receptie|Barneveld|Gastheer">Bekijk dienst</button></div><h3>Daarna deze week</h3>${own.slice(1).map(agendaItem).join('')}`;
      } else if (layout === 'coverage') {
        content = `${dayPicker(s)}<h3>${days[s.day]} ${dates[s.day]} ${s.day === 6 ? 'november' : 'oktober'}</h3>${
          own
            .filter((x) => x.day === s.day)
            .map(agendaItem)
            .join('') ||
          '<p class="cop-sub" style="padding:25px 0">Je bent deze dag niet ingepland.</p>'
        }<div class="cop-requirement" style="margin-top:18px"><h3>Beschikbaarheid</h3><p class="cop-sub">${s.available[s.day] ? 'Beschikbaar voor deze dag' : 'Niet beschikbaar voor deze dag'}</p><button class="cop-button cop-full" data-phone-tab="availability">Aanpassen</button></div><button class="cop-button cop-full" data-phone-tab="open">Bekijk open diensten</button>`;
      } else {
        content = `<div class="cop-top"><h3>26 okt – 1 nov</h3><span class="cop-tag">18 uur</span></div>${own.map(agendaItem).join('')}<button class="cop-button cop-full" data-phone-tab="open">1 open dienst bekijken</button><p class="cop-note">Alleen je eigen gepubliceerde diensten.</p>`;
      }
      return `<div class="cop-phone-head"><div class="cop-brand">COP<span>●</span> <small>Mijn werk</small></div><small>Goedemorgen Noor</small><h2>${s.tab === 'roster' ? (layout === 'cards' ? 'Klaar voor vandaag?' : 'Mijn rooster') : s.tab === 'open' ? 'Extra werken' : 'Beschikbaarheid'}</h2></div><div class="cop-phone-body">${content}</div><nav class="cop-bottom" aria-label="Medewerkernavigatie">${[
        ['roster', 'calendar-days', 'Rooster'],
        ['availability', 'calendar-check', 'Beschikbaar'],
        ['open', 'circle-plus', 'Open diensten'],
      ]
        .map(
          ([key, ic, label]) =>
            `<button data-phone-tab="${key}" aria-pressed="${s.tab === key}">${icon(ic)}${label}</button>`,
        )
        .join('')}</nav>`;
    }
    function render(section) {
      const layout = section.dataset.layout,
        s = states[layout],
        displayView = root.clientWidth <= 600 ? 'employee' : s.view;
      section
        .querySelectorAll('[data-view]')
        .forEach((b) =>
          b.setAttribute(
            'aria-pressed',
            String(b.dataset.view === displayView),
          ),
        );
      const manager = section.querySelector('.cop-manager');
      manager.hidden = displayView !== 'manager';
      section.querySelector('.cop-employee').hidden =
        displayView !== 'employee';
      manager.innerHTML = `<aside class="cop-nav"><div class="cop-brand">COP<span>●</span></div><span class="cop-nav-label">${layout === 'coverage' ? '⌂' : 'Overzicht'}</span><span class="cop-nav-label cop-nav-active">${layout === 'coverage' ? '▦' : 'Rooster'}</span><span class="cop-nav-label">${layout === 'coverage' ? '♧' : 'Medewerkers'}</span><span class="cop-nav-label">${layout === 'coverage' ? '◷' : 'Uren'}</span></aside><main class="cop-main">${header(layout)}${layout === 'week' ? week(s) : layout === 'cards' ? board(s) : coverage(s)}</main>`;
      section.querySelector('.cop-employee').innerHTML = employee(layout, s);
      globalThis.lucide?.createIcons({ attrs: { width: 18, height: 18 } });
    }
    function notify(section, message) {
      section.querySelector('.cop-feedback')?.remove();
      const e = document.createElement('div');
      e.className = 'cop-feedback';
      e.setAttribute('role', 'status');
      e.textContent = message;
      const host =
        states[section.dataset.layout].view === 'employee' ||
        matchMedia('(max-width:600px)').matches
          ? section.querySelector('.cop-phone-body')
          : section.querySelector('.cop-main');
      host.append(e);
    }
    function sheet(section, type, options = {}) {
      section.querySelector('.cop-sheet')?.remove();
      const s = states[section.dataset.layout];
      const e = document.createElement('div');
      e.className = 'cop-sheet';
      e.setAttribute('role', 'dialog');
      e.setAttribute(
        'aria-label',
        type === 'plan' ? 'Dienst plannen' : 'Dienst bekijken',
      );
      if (type === 'plan') {
        e.innerHTML = `<div><h3>Dienst plannen</h3><p class="cop-sub">${days[options.day]} ${dates[options.day]} ${options.day === 6 ? 'november' : 'oktober'} · Barneveld</p><label>Medewerker<select name="person">${names.map((n) => `<option ${n === (options.target || s.person) ? 'selected' : ''}>${n}</option>`).join('')}</select></label><label>Diensttype<select name="shiftType">${shiftTypes.map((type) => `<option ${type === (options.shiftType || 'Allround') ? 'selected' : ''}>${type}</option>`).join('')}</select></label><label>Begintijd<input name="start" type="time" value="15:00" required></label><label>Eindtijd<input name="end" type="time" value="21:00" required></label><p class="cop-note">Voorbeeld · wijzigingen worden niet naar COP verstuurd.</p><div class="cop-sheet-actions"><button type="button" class="cop-button" data-close>Annuleren</button><button class="cop-button cop-primary" type="button" data-plan-save>Inplannen</button></div></div>`;
        e.querySelector('[data-plan-save]').addEventListener('click', () => {
          const f = new Map(
              ['person', 'shiftType', 'start', 'end'].map((key) => [
                key,
                e.querySelector('[name=' + key + ']').value,
              ]),
            ),
            start = f.get('start'),
            end = f.get('end');
          if (!start || !end || end <= start) {
            e.querySelector('[name=end]').setCustomValidity(
              'Kies een eindtijd na de begintijd.',
            );
            e.querySelector('[name=end]').reportValidity();
            return;
          }
          s.added = s.added.filter(
            (x) => !(x.person === f.get('person') && x.day === options.day),
          );
          s.added.push({
            person: f.get('person'),
            day: options.day,
            time: start + '–' + end,
            shiftType: f.get('shiftType'),
            role: options.role || 'Receptie',
          });
          e.remove();
          render(section);
          save();
          notify(section, 'Voorbeeld: dienst ingepland.');
        });
      } else {
        const [time, role, site = 'Barneveld', shiftType = 'Allround'] =
          options.detail.split('|');
        const mobile =
          s.view === 'employee' || matchMedia('(max-width:600px)').matches;
        e.innerHTML = `<h3>${esc(shiftType)}</h3><p class="cop-sub">Activiteit · ${esc(role)}</p><p><strong>${esc(time)}</strong></p><p class="cop-sub">${esc(site)} · Gepubliceerd</p><p style="margin-top:20px">Meld je bij de receptie. De dienstinformatie staat hier bij elkaar.</p><div class="cop-sheet-actions"><button class="cop-button" data-close>Sluiten</button>${mobile ? '<button class="cop-button cop-primary" data-swap>Wissel aanvragen</button>' : ''}</div>`;
        e.querySelector('[data-swap]')?.addEventListener('click', () => {
          e.remove();
          notify(
            section,
            'Voorbeeld: wissel aangevraagd, wacht op bevestiging van de planner.',
          );
        });
      }
      section.querySelector('.cop-stage').append(e);
      e.querySelector('[data-close]').addEventListener('click', () =>
        e.remove(),
      );
      e.querySelector('select,input,button')?.focus();
    }
    root.querySelectorAll('.cop-concept').forEach((section) => {
      const key = section.dataset.layout;
      render(section);
      section.addEventListener('click', (event) => {
        const b = event.target.closest('button');
        if (!b) return;
        const s = states[key];
        if (b.dataset.view) {
          s.view = b.dataset.view;
          render(section);
          save();
        } else if (b.dataset.person) {
          s.person = b.dataset.person;
          render(section);
          save();
        } else if (b.dataset.plan !== undefined) {
          sheet(section, 'plan', {
            day: Number(b.dataset.plan),
            target: b.dataset.target,
            shiftType: b.dataset.shiftType,
            role: b.dataset.role,
          });
        } else if (b.dataset.details) {
          sheet(section, 'details', { detail: b.dataset.details });
        } else if (b.dataset.phoneTab) {
          s.tab = b.dataset.phoneTab;
          render(section);
          save();
        } else if (b.dataset.day !== undefined) {
          s.day = Number(b.dataset.day);
          render(section);
          save();
        } else if (b.hasAttribute('data-save-availability')) {
          save();
          notify(section, 'Voorbeeld: beschikbaarheid doorgegeven.');
        } else if (b.hasAttribute('data-claim')) {
          s.claimed = true;
          render(section);
          save();
          notify(section, 'Voorbeeld: je interesse is doorgegeven.');
        } else if (b.hasAttribute('data-publish')) {
          notify(
            section,
            'Voorbeeld: het rooster is gepubliceerd. Medewerkers zien hun eigen diensten.',
          );
        }
      });
      section.addEventListener('change', (event) => {
        if (event.target.dataset.available !== undefined) {
          states[key].available[Number(event.target.dataset.available)] =
            event.target.checked;
          render(section);
          save();
        }
      });
      section.addEventListener('dragstart', (event) => {
        const b = event.target.closest('[data-person]');
        if (b) event.dataTransfer.setData('text/plain', b.dataset.person);
      });
      section.addEventListener('dragover', (event) => {
        if (event.target.closest('[data-drop]')) event.preventDefault();
      });
      section.addEventListener('drop', (event) => {
        const cell = event.target.closest('[data-drop]');
        if (!cell) return;
        event.preventDefault();
        const person = event.dataTransfer.getData('text/plain');
        if (!names.includes(person)) return;
        states[key].person = person;
        sheet(section, 'plan', {
          day: Number(cell.dataset.drop),
          target: person,
          shiftType: cell.dataset.shiftType,
          role: cell.dataset.role,
        });
      });
      if (globalThis.Tweak) {
        const options = { roomy: false };
        const tweak = new Tweak({
          container: section,
          onChange: () => {
            section.style.setProperty(
              '--cop-design-spacing',
              options.roomy ? '24px' : '16px',
            );
            section
              .querySelectorAll('.cop-pool,.cop-requirement')
              .forEach(
                (x) => (x.style.padding = options.roomy ? '22px' : '13px'),
              );
          },
        });
        tweak.addToggle(options, 'roomy', { label: 'Meer witruimte' });
      }
    });
    let wasNarrow = root.clientWidth <= 600;
    new ResizeObserver(() => {
      const narrow = root.clientWidth <= 600;
      if (narrow !== wasNarrow) {
        wasNarrow = narrow;
        root.querySelectorAll('.cop-concept').forEach(render);
      }
    }).observe(root);
    window.addEventListener('openai:set_globals', (event) => {
      if (event.detail?.globals?.widgetState) {
        restore(event.detail.globals.widgetState);
        root.querySelectorAll('.cop-concept').forEach(render);
      }
    });
  })();
</script>
